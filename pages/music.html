<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music IA — Inspecteur Pmiller</title>
<style>
body{background:#0f0f12;color:#fff;font-family:system-ui,sans-serif;margin:0;padding:1rem}
.card{background:#1a1a20;border-radius:1.25rem;padding:1.25rem;margin-bottom:1rem;box-shadow:0 10px 30px rgba(0,0,0,.6)}
button{background:#6d28d9;color:#fff;border:none;border-radius:9999px;padding:.75rem 1.5rem;font-weight:600;margin-top:.5rem;cursor:pointer}
textarea{width:100%;border-radius:1rem;background:#12121a;border:none;padding:1rem;color:#fff;resize:none}
.tags span{display:inline-block;background:#2a2a35;padding:.25rem .75rem;border-radius:9999px;margin-right:.5rem;font-size:.85rem}
</style>
</head>
<body>
<h1>Inspecteur Pmiller</h1>
<p>Studio IA Mobile,</p>

<div class="card">
<h2>Paroles</h2>
<textarea rows="3" placeholder="Écrivez des paroles ou une suggestion"></textarea>
<div style="margin-top:.75rem"><label><input type="checkbox" checked> Instrumental</label></div>
</div>

<div class="card">
<h2>Styles</h2>
<p>Décrivez le son que vous souhaitez donner à votre chanson.</p>
<div class="tags"><span>edm</span><span>anime</span><span>male vocals</span></div>
<button>Remixer cette chanson</button>
</div>

<div class="card">
<h2>Titre de la chanson</h2>
<input type="text" placeholder="Titre" style="width:100%;padding:.75rem;border-radius:.75rem;border:none;background:#12121a;color:#fff;">
</div>

<button style="width:100%;padding:1rem;font-size:1.1rem">Créer</button>
<p style="font-size:.8rem;color:#aaa">Fonctionnement via Internet / moteur IA externe</p>
</body>
</html>
